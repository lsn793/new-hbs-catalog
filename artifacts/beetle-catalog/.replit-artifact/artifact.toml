kind = "web"
previewPath = "/"
title = "Beetle Catalog"
description = "A browsable beetle reference catalog that loads beetle names and attributes from a hosted JSON file, with detailed records and a linked index."
version = "1.0.0"
id = "artifacts/beetle-catalog"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18994

[services.development]
run = "pnpm --filter @workspace/beetle-catalog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beetle-catalog", "run", "build" ]
serve = "static"
publicDir = "artifacts/beetle-catalog/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18994"
BASE_PATH = "/"
